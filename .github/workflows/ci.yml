name: CI

# Three gates, each cheap enough to run on every push and pull request:
#   lint    -- in-repo ruff and pylint configuration, no developer overrides
#   test    -- pytest on every supported Python, with the coverage floor the
#              release gate also enforces
#   package -- build sdist+wheel, inspect them with the same inspector
#              `./bless` runs, then install the wheel and exercise the
#              installed console scripts

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the dev toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Lint with Pylint
        run: python -m pylint my_snaps

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Byte-compile the package and the tests
        run: python -m compileall -q my_snaps tests

      - name: Run tests with coverage
        run: >-
          python -m pytest -v
          --cov=my_snaps
          --cov-report=term-missing
          --cov-fail-under=80

  package:
    name: packaging smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      # The same inspector ./bless runs before an upload, so CI and the
      # maintainer cannot disagree about what a valid artifact is.  It reads
      # the expected metadata from pyproject.toml and my_snaps/__init__.py,
      # never from the artifact it is checking.
      - name: Inspect the built distributions
        run: python tests/inspect_dist.py dist/*.whl dist/*.tar.gz

      - name: Install the wheel into a clean virtualenv
        run: |
          python -m venv /tmp/my-snaps-wheel
          /tmp/my-snaps-wheel/bin/python -m pip install --upgrade pip
          /tmp/my-snaps-wheel/bin/python -m pip install dist/*.whl

      - name: Import the installed package
        run: |
          /tmp/my-snaps-wheel/bin/python - <<'PY'
          import my_snaps
          from my_snaps.MyUtils import version_string

          assert my_snaps.__version__
          assert version_string() == my_snaps.__version__
          print(f'installed package OK: my_snaps {my_snaps.__version__}')
          PY

      - name: Exercise the installed console scripts
        run: |
          version=$(/tmp/my-snaps-wheel/bin/python -c 'import my_snaps; print(my_snaps.__version__)')
          /tmp/my-snaps-wheel/bin/my-snaps --version | grep -F "$version"
          /tmp/my-snaps-wheel/bin/my-restore --version | grep -F "$version"
          /tmp/my-snaps-wheel/bin/bt-smart-balance --version | grep -F "$version"
