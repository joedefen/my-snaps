[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "my-snaps"
version = "2.0.0"
description = "Simple BTRFS Snapshot Tools"
authors = [
    {name = "Joe Defen", email = "joedef@duck.com"},
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Range, not an exact pin: the dependency published 31 releases in about
    # 26 hours, and an exact pin makes every install a potential resolution
    # failure. The floor is the first release with the inline-editor caret
    # support this package uses.
    "console-window >= 2.0.0.10, <3",
]
keywords = ["BTRFS", "snapshot", "restore", "balance", ]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
"Homepage" = "https://github.com/joedefen/my-snaps"
"Bug Tracker" = "https://github.com/joedefen/my-snaps/issues"

[project.scripts]
my-snaps = "my_snaps.main:run"
my-restore = "my_snaps.my_restore:run"
bt-smart-balance = "my_snaps.bt_smart_balance:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
