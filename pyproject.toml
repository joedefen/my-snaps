[build-system]
# 3.12 is the first flit_core release that understands the PEP 639 `license`
# expression and `license-files` keys used in the `[project]` table below.
requires = ["flit_core>=3.12"]
build-backend = "flit_core.buildapi"

[project]
name = "my-snaps"
version = "2.0.1"
description = "Simple BTRFS Snapshot Tools"
authors = [
    {name = "Joe Defen", email = "joedef@duck.com"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "console-window==2.1.3"
]
keywords = ["BTRFS", "snapshot", "restore", "balance", ]
# No `License ::` classifier: PEP 639 deprecates it in favour of the SPDX
# expression above, and flit_core 3.12 emits a deprecation warning for it.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pylint>=3.3",
    "ruff>=0.9",
]

[project.urls]
"Homepage" = "https://github.com/joedefen/my-snaps"
"Bug Tracker" = "https://github.com/joedefen/my-snaps/issues"

[project.scripts]
my-snaps = "my_snaps.main:run"
my-restore = "my_snaps.my_restore:run"
bt-smart-balance = "my_snaps.bt_smart_balance:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
# Keep Ruff deterministic in CI instead of inheriting a developer's global
# configuration. 3.11 is the oldest interpreter the package supports.
target-version = "py311"
line-length = 120
src = ["my_snaps", "tests"]

[tool.ruff.lint]
# Small, high-signal set: pycodestyle errors, Pyflakes, import sorting,
# pyupgrade and bugbear. Formatting-only rules are intentionally excluded.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pylint.main]
# Lint against the oldest supported interpreter so the checks stay valid for
# every version in `requires-python`.
py-version = "3.11"

[tool.pylint.basic]
# `MyUtils` and `InlineMenu` predate the package's snake_case renaming and are
# imported by tests and downstream callers, so exempt only those two module
# names instead of disabling `invalid-name` file by file.
module-rgx = "^([a-z_][a-z0-9_]*|MyUtils|InlineMenu)$"
